<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おやつ日和 要件定義</title>
<style>
  :root {
    --bg: #fbf8f3;
    --paper: #ffffff;
    --ink: #2b2620;
    --muted: #7a6f63;
    --line: #e8e0d4;
    --accent: #c4703a;
    --accent-soft: #fbeee3;
    --side: #f4eee5;
    --code: #f6f2ec;
    --safety: #fff5f2;
    --safety-line: #d9534f;
    --side-w: 290px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 16px; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.8;
    font-size: 15px;
  }

  /* サイドバー */
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: var(--side-w);
    background: var(--side); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; z-index: 10;
  }
  .brand { padding: 20px 20px 12px; border-bottom: 1px solid var(--line); }
  .brand .name { font-size: 18px; font-weight: 700; }
  .brand .sub-title { font-size: 12px; color: var(--muted); }
  .search { margin: 12px 16px 4px; }
  .search input {
    width: 100%; padding: 7px 10px; font: inherit; font-size: 13px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper);
  }
  nav { overflow-y: auto; padding: 8px 8px 40px; flex: 1; }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav a {
    display: block; color: var(--ink); text-decoration: none;
    padding: 4px 10px; border-radius: 6px; font-size: 13px; line-height: 1.5;
  }
  nav a:hover { background: rgba(0,0,0,.05); }
  .doc-link { font-weight: 700; margin-top: 6px; }
  .sub { display: none; margin: 2px 0 6px 8px; border-left: 2px solid var(--line); }
  .doc-item.open .sub, nav.filtering .sub { display: block; }
  .sub .lv3 a { padding-left: 22px; font-size: 12px; color: var(--muted); }
  nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  nav li.hidden { display: none; }

  /* 本文 */
  main { margin-left: var(--side-w); padding: 32px 48px 120px; }
  .doc {
    max-width: 1000px; background: var(--paper); border: 1px solid var(--line);
    border-radius: 12px; padding: 32px 40px; margin: 0 auto 32px;
  }
  h1 { font-size: 26px; margin: 0 0 20px; padding-bottom: 12px; border-bottom: 3px solid var(--accent); }
  h2 { font-size: 20px; margin: 36px 0 12px; padding-left: 10px; border-left: 5px solid var(--accent); }
  h3 { font-size: 17px; margin: 28px 0 10px; }
  h4 { font-size: 15px; margin: 22px 0 8px; color: var(--muted); }
  p { margin: 10px 0; }
  a { color: var(--accent); }
  hr { border: none; border-top: 1px dashed var(--line); margin: 32px 0; }
  ul, ol { padding-left: 1.6em; }
  li { margin: 3px 0; }
  code {
    font-family: "Cascadia Code", Consolas, "BIZ UDGothic", monospace; font-size: .9em;
    background: var(--code); padding: 1px 5px; border-radius: 4px;
  }
  pre {
    background: var(--code); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; overflow-x: auto; line-height: 1.55;
  }
  pre code { background: none; padding: 0; font-size: 13px; }
  blockquote {
    margin: 14px 0; padding: 8px 16px; border-left: 4px solid var(--safety-line);
    background: var(--safety); border-radius: 0 8px 8px 0;
  }
  .table-wrap { overflow-x: auto; margin: 12px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
  th { background: #f7f1e8; white-space: nowrap; }
  tbody tr:nth-child(even) { background: #fdfbf8; }
  td:first-child code, td:first-child { white-space: nowrap; }
  tr.safety td { background: var(--safety); }
  tr.safety td:first-child { border-left: 4px solid var(--safety-line); font-weight: 700; }

  .badge {
    display: inline-block; padding: 1px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 700; white-space: nowrap;
  }
  .b-must { background: #fde2e1; color: #b3261e; }
  .b-nice { background: #fff1cc; color: #8a5a00; }
  .b-extra { background: #e8eef7; color: #3c5a85; }
  .b-done { background: #def5e3; color: #1e7a3a; }
  .b-part { background: #fff1cc; color: #8a5a00; }
  .b-open { background: #eeeeee; color: #555555; }

  .menu-btn {
    display: none; position: fixed; top: 12px; left: 12px; z-index: 20;
    border: 1px solid var(--line); background: var(--paper); border-radius: 8px;
    padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .to-top {
    position: fixed; right: 20px; bottom: 20px; width: 40px; height: 40px;
    border-radius: 50%; border: 1px solid var(--line); background: var(--paper);
    color: var(--accent); font-size: 18px; text-decoration: none;
    display: flex; align-items: center; justify-content: center;
  }

  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 24px rgba(0,0,0,.15); }
    body.nav-open .sidebar { transform: none; }
    .menu-btn { display: block; }
    main { margin-left: 0; padding: 60px 12px 80px; }
    .doc { padding: 22px 18px; }
  }
  @media print {
    .sidebar, .menu-btn, .to-top { display: none; }
    main { margin: 0; padding: 0; }
    .doc { border: none; padding: 0; page-break-after: always; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<button class="menu-btn" type="button" aria-label="目次を開く">☰ 目次</button>
<aside class="sidebar">
  <div class="brand">
    <div class="name">🍪 おやつ日和</div>
    <div class="sub-title">要件定義（docs/requirements の md から生成）</div>
  </div>
  <div class="search"><input type="search" placeholder="目次を絞り込む（例：予算、SR）" aria-label="目次を絞り込む"></div>
  <nav>
    <ul>
{{NAV}}
    </ul>
  </nav>
</aside>
<main>
{{BODY}}
</main>
<a class="to-top" href="#README" aria-label="先頭へ戻る">↑</a>
<script>
  // 表示中の見出しを目次で強調し、その文書の小見出しを開く
  const nav = document.querySelector("nav");
  const links = [...nav.querySelectorAll("a")];
  const byId = new Map(links.map(a => [decodeURIComponent(a.hash.slice(1)), a]));
  const headings = [...document.querySelectorAll("h1[id], h2[id], h3[id]")].filter(h => byId.has(h.id));

  function setActive(id) {
    links.forEach(a => a.classList.remove("active"));
    const a = byId.get(id);
    if (!a) return;
    a.classList.add("active");
    document.querySelectorAll(".doc-item").forEach(li => li.classList.toggle("open", li.contains(a)));
    const r = a.getBoundingClientRect(), n = nav.getBoundingClientRect();
    if (r.top < n.top || r.bottom > n.bottom) a.scrollIntoView({ block: "nearest" });
  }
  function onScroll() {
    let current = headings[0];
    for (const h of headings) {
      if (h.getBoundingClientRect().top <= 80) current = h; else break;
    }
    if (current) setActive(current.id);
  }
  document.addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  // 目次の絞り込み
  const input = document.querySelector(".search input");
  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    nav.classList.toggle("filtering", q !== "");
    document.querySelectorAll(".doc-item").forEach(doc => {
      let any = false;
      doc.querySelectorAll(".sub li").forEach(li => {
        const hit = !q || li.textContent.toLowerCase().includes(q);
        li.classList.toggle("hidden", !hit);
        any = any || hit;
      });
      const titleHit = !q || doc.querySelector(".doc-link").textContent.toLowerCase().includes(q);
      doc.classList.toggle("hidden", !(any || titleHit));
    });
  });

  // スマホ：目次の開閉
  document.querySelector(".menu-btn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
  nav.addEventListener("click", e => { if (e.target.tagName === "A") document.body.classList.remove("nav-open"); });
</script>
</body>
</html>
