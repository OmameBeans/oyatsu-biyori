# main への push ごとに、ビルド・テスト・lint を確かめる（HK-CC-10）
# 基準は REVIEW.md。失敗したら、次の作業の前に直す
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # 開発機・本番（Windows Server）に合わせて Windows で動かす
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/oyatsubiyori.client/package-lock.json

      - name: フロントの依存関係を入れる
        working-directory: src/oyatsubiyori.client
        run: npm ci

      - name: フロントの lint
        working-directory: src/oyatsubiyori.client
        run: npm run lint

      - name: フロントのビルド（型チェックを含む）
        working-directory: src/oyatsubiyori.client
        run: npm run build

      - name: ソリューションのビルド
        run: dotnet build OyatsuBiyori.slnx -c Release

      - name: Biz のテスト
        run: dotnet test src/OyatsuBiyori.Biz.Tests -c Release --no-build
