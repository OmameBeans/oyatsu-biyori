<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
  @page { size: {{sheet_w}}px {{sheet_h}}px; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #fff;
    color: #222;
    font-family: "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .sheet { width: {{sheet_w}}px; height: {{sheet_h}}px; padding: 12px; background: #fff; }
  .head { height: 56px; display: flex; align-items: center; gap: 12px; border-bottom: 3px solid #e2d8cf; }
  .head .section { background: #8a7b70; color: #fff; font-size: 20px; font-weight: 700; padding: 8px 28px 8px 16px; border-radius: 0 22px 22px 0; }
  .head .sub { font-size: 14px; color: #6b5e55; }
  .head .publisher { margin-left: auto; text-align: right; font-size: 12px; color: #6b5e55; line-height: 1.4; }
  .head .publisher b { font-size: 15px; color: #a04a2c; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: {{cell_h}}px; }
  .cell { position: relative; padding: 6px 8px 6px 8px; border-right: 1px dashed #c9c1ba; border-bottom: 1px dashed #c9c1ba; overflow: hidden; }
  .cell:nth-child(5n) { border-right: none; }
  .age { display: inline-block; color: #fff; font-size: 12px; font-weight: 700; padding: 2px 14px 2px 8px; border-radius: 0 10px 10px 0; margin-left: -8px; }
  .age.baby { background: #ef7f8f; }
  .age.one { background: #4fae6b; }
  .age.two { background: #e98a2c; }
  .age.three { background: #4d86c7; }
  .origin { font-size: 9.5px; color: #555; margin-top: 3px; }
  .meta { margin-top: 3px; width: 134px; }
  .code { display: inline-block; border: 1.5px solid #333; font-size: 19px; font-weight: 700; padding: 0 4px; line-height: 1.15; letter-spacing: 0.5px; }
  .meta .small { font-size: 9px; color: #444; line-height: 1.3; margin-top: 2px; }
  .name { font-size: 15px; font-weight: 700; line-height: 1.2; margin-top: 2px; width: 134px; }
  .volume { font-size: 12px; margin-top: 2px; }
  .price { position: absolute; left: 8px; top: 160px; display: flex; align-items: flex-end; gap: 2px; }
  .price .honntai { font-size: 10px; writing-mode: vertical-rl; line-height: 1; margin-bottom: 4px; }
  .price .num { font-size: 31px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .price .yen { font-size: 12px; font-weight: 700; margin-bottom: 3px; }
  .price .tax { font-size: 12px; margin-left: 4px; margin-bottom: 2px; }
  .price .tax b { font-size: 15px; }
  .unit { position: absolute; right: 8px; top: 128px; border: 1px solid #555; font-size: 10px; text-align: center; padding: 1px 4px; line-height: 1.25; background: #fff; }
  .unit b { font-size: 13px; }
  .pkg { position: absolute; right: 8px; top: 30px; width: 70px; height: 84px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: inset 0 -10px 0 rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.25); }
  .pkg .icon { font-size: 34px; line-height: 1; font-family: "Segoe UI Emoji", sans-serif; }
  .pkg .label { font-size: 9px; font-weight: 700; color: #fff; text-align: center; margin-top: 4px; padding: 0 4px; text-shadow: 0 1px 1px rgba(0,0,0,0.4); line-height: 1.2; }
  .sticker { position: absolute; right: -2px; top: 10px; z-index: 1; width: 44px; height: 44px; border-radius: 50%; background: #e23b3b; color: #fff; font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.15; transform: rotate(-12deg); box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
  .bulk { position: absolute; right: 8px; top: 100px; background: #1f3e75; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 4px; line-height: 1.2; text-align: center; border-radius: 3px; width: 70px; }
  .chilled { position: absolute; right: 26px; top: 100px; background: #2a8fc9; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 5px; border-radius: 3px; }
  .desc { position: absolute; left: 8px; right: 8px; top: 197px; font-size: 10px; line-height: 1.4; color: #333; }
  .foot { height: 22px; font-size: 10.5px; color: #777; padding-top: 5px; text-align: right; }
{{extra_css}}
</style>
</head>
<body class="{{body_class}}">
<div class="sheet">
  <div class="head">
    <div class="section">{{section}}</div>
    <div class="sub">{{subsection}}</div>
    <div class="publisher"><b>{{publisher}}</b>　{{issue}}<br>サンプル（架空のチラシ）</div>
  </div>
  <div class="grid">
{{cells}}
  </div>
  <div class="foot">※このチラシは開発用の架空のサンプルです。実在の商品・企業・団体とは関係ありません。価格は本体価格（税込価格）です。</div>
</div>
</body>
</html>
