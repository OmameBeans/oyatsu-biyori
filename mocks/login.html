<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン | おやつ日和</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="assets/mock.css">
<style>
  body { min-height: 100vh; display: grid; grid-template-rows: 1fr auto; background: linear-gradient(160deg, #1565c0 0%, #1976d2 38%, #f4f6fa 38%); }
  .wrap { display: grid; place-items: center; padding: 48px 16px; }
  .login { width: 100%; max-width: 420px; padding: 36px 32px 28px; border-radius: 12px; box-shadow: var(--shadow-8); }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 24px; }
  .logo .mark { width: 56px; height: 56px; border-radius: 14px; background: var(--primary); color: #fff; display: grid; place-items: center; }
  .logo .mark .material-symbols-outlined { font-size: 32px; }
  .foot { text-align: center; font-size: 12px; color: var(--text-2); padding: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="paper login">
    <div class="logo">
      <span class="mark"><span class="material-symbols-outlined icon-fill">cookie</span></span>
      <div class="h5">おやつ日和</div>
      <div class="caption">学童保育のおやつ献立アシスタント</div>
    </div>
    <div class="alert alert-error mb-16">
      <span class="material-symbols-outlined">error</span>
      <div class="alert-body">ユーザー名かパスワードが違います。あと 3回まちがえると、15分間ログインできなくなります。</div>
    </div>
    <form class="stack" onsubmit="location.href='menus.html';return false">
      <div class="field"><label for="u">ユーザー名</label><div class="input-adorn"><span class="material-symbols-outlined">person</span><input id="u" class="input" value="himawari" autocomplete="username"></div></div>
      <div class="field"><label for="p">パスワード</label><div class="input-adorn"><span class="material-symbols-outlined">lock</span><input id="p" class="input" type="password" autocomplete="current-password"><span class="suffix material-symbols-outlined" style="cursor:pointer">visibility</span></div></div>
      <label class="checkbox"><input type="checkbox" checked>ログインしたままにする（30日）</label>
      <button class="btn btn-contained btn-lg" type="submit" style="width:100%">ログイン</button>
    </form>
    <p class="caption mt-16" style="text-align:center">アカウントは施設に1つです。パスワードを忘れたときは、アプリを設置した人に連絡してください。</p>
  </div>
</div>
<div class="foot"><a href="landing.html">おやつ日和について</a></div>
<script src="assets/mock.js"></script>
</body>
</html>
